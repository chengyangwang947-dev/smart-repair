<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能报修小助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="app" class="max-w-4xl mx-auto px-4 py-6"></div>

  <script>
    const STATUS = {
      pending: { label: '待处理', cls: 'bg-amber-100 text-amber-800' },
      processing: { label: '处理中', cls: 'bg-blue-100 text-blue-800' },
      done: { label: '已完成', cls: 'bg-emerald-100 text-emerald-800' },
    };

    let currentUser = null;
    let repairs = [];
    let activeFilter = 'all';
    let detailId = null;
    let generating = false;

    const app = document.getElementById('app');

    async function api(path, options = {}) {
      const resp = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const body = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(body.error || `请求失败（HTTP ${resp.status}）`);
      return body;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // ---------- 登录 ----------
    function renderLogin() {
      app.innerHTML = `
        <div class="max-w-sm mx-auto mt-16 bg-white rounded-2xl shadow p-8">
          <h1 class="text-2xl font-bold text-center mb-1">智能报修小助手</h1>
          <p class="text-center text-slate-500 mb-6">练习四 · 两人协作开发项目</p>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1">账号</label>
              <input id="login-user" type="text" class="w-full border rounded-lg px-3 py-2" placeholder="studentA / studentB" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">密码</label>
              <input id="login-pass" type="password" class="w-full border rounded-lg px-3 py-2" />
            </div>
            <button id="login-btn" class="w-full bg-indigo-600 text-white rounded-lg py-2 font-medium hover:bg-indigo-700">登录</button>
            <p id="login-error" class="text-red-600 text-sm hidden"></p>
          </div>
        </div>`;
      document.getElementById('login-btn').onclick = doLogin;
      document.getElementById('login-pass').onkeydown = (e) => e.key === 'Enter' && doLogin();
    }

    async function doLogin() {
      const username = document.getElementById('login-user').value.trim();
      const password = document.getElementById('login-pass').value;
      try {
        const body = await api('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        currentUser = body.user;
        renderApp();
      } catch (err) {
        const el = document.getElementById('login-error');
        el.textContent = err.message;
        el.classList.remove('hidden');
      }
    }

    async function doLogout() {
      await api('/api/logout', { method: 'POST' });
      currentUser = null;
      renderLogin();
    }

    // ---------- 主界面 ----------
    async function renderApp() {
      await loadRepairs();
      renderLayout();
    }

    async function loadRepairs() {
      const body = await api(`/api/repairs?status=${activeFilter}`);
      repairs = body.repairs || [];
    }

    function renderLayout() {
      app.innerHTML = `
        <header class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-xl font-bold">智能报修小助手</h1>
            <p class="text-sm text-slate-500">当前用户：${escapeHtml(currentUser.name)}</p>
          </div>
          <button id="logout-btn" class="text-sm text-slate-600 border rounded-lg px-3 py-1.5 hover:bg-white">退出登录</button>
        </header>

        <div class="grid md:grid-cols-2 gap-6">
          <section class="bg-white rounded-2xl shadow p-5">
            <h2 class="font-semibold mb-4">提交报修</h2>
            <div class="space-y-3">
              <input id="f-name" class="w-full border rounded-lg px-3 py-2" placeholder="测试姓名" value="${escapeHtml(currentUser.name)}" />
              <input id="f-area" class="w-full border rounded-lg px-3 py-2" placeholder="办公区（如：3楼东区）" />
              <input id="f-device" class="w-full border rounded-lg px-3 py-2" placeholder="设备（如：打印机 / 投影仪 / 空调）" />
              <textarea id="f-desc" rows="3" class="w-full border rounded-lg px-3 py-2" placeholder="故障描述"></textarea>
              <button id="f-submit" class="w-full bg-indigo-600 text-white rounded-lg py-2 font-medium hover:bg-indigo-700">提交报修</button>
              <p id="form-error" class="text-red-600 text-sm hidden"></p>
            </div>
          </section>

          <section>
            <div class="flex gap-2 mb-4 flex-wrap" id="filter-tabs"></div>
            <div id="repair-list" class="space-y-3"></div>
          </section>
        </div>

        <div id="detail-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-20"></div>`;

      document.getElementById('logout-btn').onclick = doLogout;
      document.getElementById('f-submit').onclick = submitRepair;
      renderFilters();
      renderList();
    }

    function renderFilters() {
      const tabs = [
        { value: 'all', label: '全部' },
        { value: 'pending', label: '待处理' },
        { value: 'processing', label: '处理中' },
        { value: 'done', label: '已完成' },
      ];
      document.getElementById('filter-tabs').innerHTML = tabs.map((t) => `
        <button data-v="${t.value}" class="filter-btn text-sm border rounded-full px-3 py-1 ${activeFilter === t.value ? 'bg-slate-800 text-white' : 'bg-white hover:bg-slate-50'}">${t.label}</button>
      `).join('');
      document.querySelectorAll('.filter-btn').forEach((btn) => {
        btn.onclick = async () => {
          activeFilter = btn.dataset.v;
          await loadRepairs();
          renderFilters();
          renderList();
        };
      });
    }

    function renderList() {
      const box = document.getElementById('repair-list');
      if (!repairs.length) {
        box.innerHTML = `<div class="bg-white rounded-2xl shadow p-6 text-slate-400 text-sm">暂无报修单</div>`;
        return;
      }
      box.innerHTML = repairs.map((r) => `
        <div class="bg-white rounded-2xl shadow p-4 cursor-pointer hover:border-indigo-300" data-id="${r.id}">
          <div class="flex justify-between items-center">
            <span class="font-medium">${escapeHtml(r.device)}</span>
            <span class="text-xs px-2 py-0.5 rounded-full ${STATUS[r.status].cls}">${STATUS[r.status].label}</span>
          </div>
          <p class="text-sm text-slate-600 mt-1 line-clamp-2">${escapeHtml(r.description)}</p>
          <p class="text-xs text-slate-400 mt-2">报修人：${escapeHtml(r.reporter_name)} · ${escapeHtml(r.office_area)}</p>
        </div>
      `).join('');
      box.querySelectorAll('[data-id]').forEach((card) => {
        card.onclick = () => openDetail(card.dataset.id);
      });
    }

    async function submitRepair() {
      const reporterName = document.getElementById('f-name').value.trim();
      const officeArea = document.getElementById('f-area').value.trim();
      const device = document.getElementById('f-device').value.trim();
      const description = document.getElementById('f-desc').value.trim();
      const errEl = document.getElementById('form-error');
      if (!reporterName || !officeArea || !device || !description) {
        errEl.textContent = '请填写完整：姓名、办公区、设备、故障描述均为必填';
        errEl.classList.remove('hidden');
        return;
      }
      errEl.classList.add('hidden');
      try {
        await api('/api/repairs', { method: 'POST', body: JSON.stringify({ reporterName, officeArea, device, description }) });
        document.getElementById('f-area').value = '';
        document.getElementById('f-device').value = '';
        document.getElementById('f-desc').value = '';
        await renderApp();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    // ---------- 详情 ----------
    async function openDetail(id) {
      detailId = id;
      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');
      await loadDetail();
    }

    async function loadDetail() {
      if (!detailId) return;
      let repair, suggestions = [];
      try {
        const body = await api(`/api/repairs/${detailId}`);
        repair = body.repair;
        suggestions = body.suggestions || [];
      } catch (err) {
        document.getElementById('detail-modal').innerHTML = `
          <div class="bg-white rounded-2xl p-6 max-w-md w-full">
            <p class="text-red-600">${escapeHtml(err.message)}</p>
            <button onclick="closeDetail()" class="mt-4 text-sm text-slate-600">关闭</button>
          </div>`;
        return;
      }

      document.getElementById('detail-modal').innerHTML = `
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[85vh] overflow-y-auto">
          <div class="flex justify-between items-start mb-3">
            <h3 class="font-semibold text-lg">报修详情</h3>
            <button id="detail-close" class="text-slate-400 hover:text-slate-600">✕</button>
          </div>
          <div class="space-y-2 text-sm">
            <p><span class="text-slate-500">设备：</span>${escapeHtml(repair.device)}</p>
            <p><span class="text-slate-500">办公区：</span>${escapeHtml(repair.office_area)}</p>
            <p><span class="text-slate-500">报修人：</span>${escapeHtml(repair.reporter_name)}</p>
            <p><span class="text-slate-500">故障描述：</span>${escapeHtml(repair.description)}</p>
            <p><span class="text-slate-500">状态：</span><span class="px-2 py-0.5 rounded-full text-xs ${STATUS[repair.status].cls}">${STATUS[repair.status].label}</span></p>
          </div>

          <div class="mt-5 border-t pt-4">
            <div class="flex items-center justify-between mb-2">
              <h4 class="font-medium">AI 排查建议</h4>
              <button id="ai-btn" class="text-sm bg-indigo-600 text-white rounded-lg px-3 py-1.5 disabled:opacity-50">获取排查建议</button>
            </div>
            <div id="ai-status" class="text-sm text-slate-500"></div>
            <ul id="ai-list" class="mt-2 space-y-2"></ul>
          </div>

          <div class="mt-5 border-t pt-4">
            <h4 class="font-medium mb-2">更新状态</h4>
            <div class="flex gap-2">
              ${['pending', 'processing', 'done'].map((s) => `
                <button data-s="${s}" class="status-btn text-sm border rounded-lg px-3 py-1.5 ${repair.status === s ? 'bg-slate-800 text-white' : 'hover:bg-slate-50'}">${STATUS[s].label}</button>
              `).join('')}
            </div>
          </div>
        </div>`;

      document.getElementById('detail-close').onclick = closeDetail;
      document.querySelectorAll('.status-btn').forEach((btn) => {
        btn.onclick = () => changeStatus(btn.dataset.s);
      });
      renderSuggestions(suggestions);
      document.getElementById('ai-btn').onclick = generateSuggestions;
    }

    function renderSuggestions(suggestions) {
      const list = document.getElementById('ai-list');
      if (!list) return;
      list.innerHTML = suggestions.map((s) => `
        <li class="bg-slate-50 rounded-lg p-3 text-sm">${escapeHtml(s.content)}</li>
      `).join('');
    }

    async function changeStatus(status) {
      try {
        await api(`/api/repairs/${detailId}`, { method: 'PATCH', body: JSON.stringify({ status }) });
        await loadDetail();
        await loadRepairs();
        renderList();
      } catch (err) {
        alert(err.message);
      }
    }

    async function generateSuggestions() {
      const btn = document.getElementById('ai-btn');
      const statusEl = document.getElementById('ai-status');
      btn.disabled = true;
      generating = true;
      statusEl.textContent = '正在生成建议，请稍候……';
      try {
        const body = await api(`/api/suggestions/${detailId}`, { method: 'POST' });
        renderSuggestions(body.suggestions || []);
        statusEl.textContent = body.reused ? '已有建议，已直接展示。' : '建议已生成并保存。';
      } catch (err) {
        statusEl.textContent = `暂时无法获取建议：${err.message}（可稍后重试）`;
      } finally {
        btn.disabled = false;
        generating = false;
      }
    }

    function closeDetail() {
      detailId = null;
      document.getElementById('detail-modal').classList.add('hidden');
      document.getElementById('detail-modal').innerHTML = '';
    }

    // ---------- 启动 ----------
    (async function init() {
      try {
        const body = await api('/api/me');
        currentUser = body.user;
        renderApp();
      } catch {
        renderLogin();
      }
    })();
  </script>
</body>
</html>
